apiVersion: v1
kind: Namespace
metadata:
  name: taskly

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskly-config
  namespace: taskly
data:
  REDIS_URL: "redis://redis:6379/0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskly-api
  namespace: taskly
  labels:
    app: taskly-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskly-api
  template:
    metadata:
      labels:
        app: taskly-api
    spec:
      containers:
        - name: api
          image: ghcr.io/tomioka05/taskly:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: REDIS_URL
            - name: DATABASE_URL
              value: "postgresql+psycopg2://tasks:tasks@postgres:5432/tasks"
            - name: OTEL_SERVICE_NAME
              value: "taskly-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: taskly-api
  namespace: taskly
  labels:
    app: taskly-api
spec:
  selector:
    app: taskly-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskly-api
  namespace: taskly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskly-api
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskly
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskly
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taskly
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "tasks"
            - name: POSTGRES_PASSWORD
              value: "tasks"
            - name: POSTGRES_DB
              value: "tasks"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U tasks -d tasks
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskly
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

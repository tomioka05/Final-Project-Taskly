apiVersion: v1
kind: Namespace
metadata:
  name: taskly

---
apiVersion: v1
kind: Secret
metadata:
  name: taskly-secrets
  namespace: taskly
type: Opaque
stringData:
  # Replace these placeholders with the managed PostgreSQL
  # and Redis connection strings in the deployment environment.
  DATABASE_URL: "postgresql+psycopg2://TASKLY_DB_USER:TASKLY_DB_PASSWORD@MANAGED_POSTGRES_HOST:5432/tasks"
  REDIS_URL: "redis://MANAGED_REDIS_HOST:6379/0"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskly-config
  namespace: taskly
data:
  OTEL_SERVICE_NAME: "taskly-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskly-api
  namespace: taskly
  labels:
    app: taskly-api
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: taskly-api

  template:
    metadata:
      labels:
        app: taskly-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: ghcr.io/tomioka05/taskly:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: REDIS_URL

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_EXPORTER_OTLP_PROTOCOL

            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_TRACES_EXPORTER

            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_METRICS_EXPORTER

            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: taskly-config
                  key: OTEL_LOGS_EXPORTER

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: taskly-api
  namespace: taskly
  labels:
    app: taskly-api
spec:
  selector:
    app: taskly-api

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskly-api
  namespace: taskly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskly-api

  minReplicas: 3
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
